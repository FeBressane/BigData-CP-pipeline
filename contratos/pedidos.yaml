# Contrato de dados · pedidos
# O validador (qualidade/04b_validar) lê as regras deste arquivo. Nada fica fixo no código.
# O catálogo (governanca/catalogo.md) é gerado a partir deste arquivo e do acordo de governança.
#
# Regras aceitas por campo:
#   tipo:        inteiro | texto | data | data_hora
#   obrigatorio: true | false
#   unico:       true            (a primeira ocorrência passa; as seguintes vão para a quarentena)
#   minimo:      número
#   maximo:      momento da carga (para datas: não pode estar no futuro)
#   dominio:     [lista de valores aceitos]
#   anonimizavel: true       (obrigatório, mas pode ficar vazio na linha anonimizada por um pedido de eliminação)
# Classificação por campo (Missão 5):
#   classe:            público | interno | confidencial | pessoal | pessoal sensível
#   classe_encontrada_pelo_varredor: true   (o produtor não tinha declarado; o varredor achou dado pessoal)
# Proteção na silver (Missão 6), obrigatória para todo campo pessoal:
#   protecao:    pseudonimo  (vira a coluna cliente_ps = HMAC-SHA-256 do id com a CHAVE_PSEUDONIMO)
#                remover     (não entra na silver; na quarentena aparece mascarado)
#                faixa_etaria (data de nascimento vira faixa: 18–24, 25–34, 35–44, 45–54, 55–64, 65+)
#                manter      (entra como está)
#   finalidade:  para que serve na silver. Obrigatória para todo campo pessoal que não é removido (Missão 7):
#                campo pessoal sem finalidade sai da silver.

conjunto: pedidos
versao: 5
descricao: Pedidos feitos na loja, um por linha, com valor, status e o cliente que comprou.
dono: ver governanca/acordo.yaml
classe: pessoal
frescor: até 24 horas depois da mudança na origem
campos:
  - nome: id
    descricao: Número do pedido.
    tipo: inteiro
    obrigatorio: true
    unico: true
    classe: interno
  - nome: cliente_id
    descricao: Cliente que fez o pedido. Liga o pedido a uma pessoa.
    tipo: inteiro
    obrigatorio: true
    anonimizavel: true  # pode ficar vazio quando o cliente pediu a eliminação (pedido em lab_controle.anonimizados)
    classe: pessoal
    protecao: pseudonimo
    finalidade: contar clientes e ligar o pedido à cidade do cliente
  - nome: valor_centavos
    descricao: Valor do pedido em centavos.
    tipo: inteiro
    obrigatorio: true
    minimo: 0
    classe: confidencial
  - nome: status
    descricao: Situação do pedido.
    tipo: texto
    obrigatorio: true
    dominio: [pendente, pago, cancelado]
    classe: interno
  - nome: criado_em
    descricao: Momento em que o pedido foi feito.
    tipo: data_hora
    obrigatorio: true
    maximo: momento da carga
    classe: interno
  - nome: observacao
    descricao: Texto livre do atendimento. Pode conter contato do cliente.
    tipo: texto
    obrigatorio: false
    classe: pessoal
    protecao: remover
    classe_encontrada_pelo_varredor: true
