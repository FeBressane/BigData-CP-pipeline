# Contrato de dados · navegacao
# Mesmo formato de contratos/pedidos.yaml.
# cliente_id é opcional: o visitante sem cadastro não tem cliente.

conjunto: navegacao
versao: 4
descricao: Cliques no site da loja, um evento por página visitada.
dono: ver governanca/acordo.yaml
classe: pessoal
frescor: até 5 segundos depois da publicação no tópico
campos:
  - nome: evento_id
    descricao: Identificador do evento.
    tipo: inteiro
    obrigatorio: true
    unico: true
    classe: interno
  - nome: cliente_id
    descricao: Cliente logado, quando houver. Vazio para visitante sem cadastro.
    tipo: inteiro
    obrigatorio: false
    classe: pessoal
    protecao: pseudonimo
    finalidade: visitas por cliente logado (leitor por_cliente)
  - nome: ip
    descricao: Endereço IP da conexão. Identifica a conexão de uma pessoa.
    tipo: texto
    obrigatorio: true
    classe: pessoal
    protecao: remover
    classe_encontrada_pelo_varredor: true
  - nome: pagina
    descricao: Página visitada.
    tipo: texto
    obrigatorio: true
    classe: interno
  - nome: quando
    descricao: Momento da visita.
    tipo: data_hora
    obrigatorio: true
    maximo: momento da carga
    classe: interno
