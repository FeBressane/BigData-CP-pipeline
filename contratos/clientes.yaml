# Contrato de dados · clientes
# Mesmo formato de contratos/pedidos.yaml.

conjunto: clientes
versao: 4
descricao: Cadastro das pessoas que compram na loja.
dono: ver governanca/acordo.yaml
classe: pessoal
frescor: até 24 horas depois da mudança na origem
campos:
  - nome: id
    descricao: Identificador do cliente. Aponta para uma pessoa.
    tipo: inteiro
    obrigatorio: true
    unico: true
    classe: pessoal
    protecao: pseudonimo
    finalidade: ligar pedidos e navegação ao mesmo cliente sem identificá-lo
  - nome: nome
    descricao: Nome completo.
    tipo: texto
    obrigatorio: true
    classe: pessoal
    protecao: remover
  - nome: email
    descricao: E-mail de contato.
    tipo: texto
    obrigatorio: true
    classe: pessoal
    protecao: remover
  - nome: cpf
    descricao: CPF do cliente.
    tipo: texto
    obrigatorio: true
    classe: pessoal
    protecao: remover
  - nome: nascimento
    descricao: Data de nascimento. Junto com a cidade, pode identificar a pessoa.
    tipo: data
    obrigatorio: true
    maximo: momento da carga
    classe: pessoal
    protecao: faixa_etaria
    finalidade: público por faixa etária; a data exata não tem uso, então só a faixa entra na silver
  - nome: cidade
    descricao: Cidade do cliente.
    tipo: texto
    obrigatorio: true
    classe: pessoal
    protecao: manter
    finalidade: receita e público por cidade (visão gold receita_por_cidade, com limiar K)
  - nome: atualizado_em
    descricao: Última alteração do cadastro na origem.
    tipo: data_hora
    obrigatorio: true
    maximo: momento da carga
    classe: interno
